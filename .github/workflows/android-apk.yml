name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    name: Compilar APK instalável
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar APK
        run: ./gradlew assembleDebug

      - name: Nomear APK
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            name="gedu-${GITHUB_REF_NAME}.apk"
          else
            name="gedu-debug.apk"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"

      - name: Disponibilizar na execução
        uses: actions/upload-artifact@v4
        with:
          name: gedu-debug-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publicar no GitHub Releases
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
