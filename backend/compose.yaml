services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hackatudo
      POSTGRES_USER: hackatudo
      POSTGRES_PASSWORD: ${HACKATUDO_DB_PASSWORD:?set HACKATUDO_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - hackatudo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackatudo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  hackatudo-postgres:
