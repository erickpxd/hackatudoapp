[versions]
agp = "8.13.2"
kotlin = "2.2.21"
composeBom = "2025.08.00"
activityCompose = "1.10.1"
lifecycle = "2.9.1"
navigation = "2.9.0"
hilt = "2.56.2"
hiltAndroidx = "1.2.0"
room = "2.8.5"
datastore = "1.1.7"
work = "2.10.2"
coroutines = "1.10.2"
junit = "4.13.2"
mockk = "1.14.2"
